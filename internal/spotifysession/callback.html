<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Auth Complete</title>
    <meta
      name="description"
      content="Spotify authentication succeeded. Return to your terminal to continue."
    />
    <style>
      @font-face {
        font-family: "Virgil";
        src: url("https://excalidraw.com/Virgil.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        --bg: #292929;
        --bg-deep: #202020;
        --grid: rgba(255, 255, 255, 0.045);
        --spotify: #1ed760;
        --spotify-muted: #777777;
        --ink: #f4f1e6;
        --muted: rgba(244, 241, 230, 0.72);
        --yellow: #fff42a;
        --green-ink: #58a270;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 24%, rgba(255, 244, 42, 0.08), transparent 30%),
          radial-gradient(circle at 18% 82%, rgba(30, 215, 96, 0.12), transparent 24%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--ink);
        font-family: "Virgil", "Comic Sans MS", "Bradley Hand", cursive;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 33px 33px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.55));
      }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 34px;
        isolation: isolate;
      }

      .brand,
      .issue-link {
        position: fixed;
        z-index: 4;
        color: var(--yellow);
        font-size: clamp(1.05rem, 2vw, 1.45rem);
        text-decoration: none;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
      }

      .brand {
        top: 18px;
        left: 22px;
        transform: rotate(-3deg);
      }

      .issue-link {
        top: 16px;
        right: 22px;
        color: rgba(244, 241, 230, 0.7);
        font-size: 0.85rem;
        transform: rotate(2deg);
      }

      .artist-field {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .artist {
        position: absolute;
        width: var(--size);
        height: var(--size);
        left: var(--x);
        top: var(--y);
        border-radius: 999px;
        border: 3px solid rgba(255, 244, 42, 0.16);
        box-shadow:
          0 18px 48px rgba(0, 0, 0, 0.26),
          inset 0 0 0 2px rgba(255, 255, 255, 0.08);
        object-fit: cover;
        opacity: 0;
        filter: saturate(0.9) contrast(0.92) brightness(0.85);
        transform: translate3d(-50%, -50%, 0) rotate(var(--tilt)) scale(0.92);
        animation:
          artist-in 900ms ease-out var(--delay) forwards,
          drift var(--duration) ease-in-out calc(var(--delay) + 700ms) infinite alternate;
      }

      .card {
        position: relative;
        z-index: 2;
        display: grid;
        justify-items: center;
        width: min(760px, 100%);
        padding: clamp(42px, 8vw, 86px) 18px;
        text-align: center;
      }

      .logo-wrap {
        position: relative;
        width: 160px;
        height: 160px;
        margin-bottom: 24px;
      }

      .logo-emblem {
        position: absolute;
        inset: 0;
        width: 160px;
        height: 160px;
        overflow: visible;
        transform-origin: center;
        animation: logo-arrive 520ms cubic-bezier(0.2, 0.9, 0.2, 1.28) both;
      }

      .logo-emblem .ring {
        fill: none;
        stroke-width: 2;
        stroke-dasharray: 5 5;
        transform-box: fill-box;
        transform-origin: center;
        animation: ring-draw 850ms ease-out both;
      }

      .logo-emblem .ring:nth-child(1) {
        stroke: rgba(255, 244, 42, 0.13);
        animation-delay: 350ms;
      }

      .logo-emblem .ring:nth-child(2) {
        stroke: rgba(255, 244, 42, 0.24);
        animation-delay: 150ms;
      }

      .logo-emblem .ring:nth-child(3) {
        stroke: rgba(255, 255, 255, 0.12);
        animation-delay: 350ms;
      }

      .logo-shadow {
        filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.28));
      }

      .spotify-green {
        clip-path: inset(100% 0 0 0);
        animation: logo-fill 980ms cubic-bezier(0.72, 0, 0.18, 1) 650ms forwards;
      }

      .star {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--star-size);
        height: var(--star-size);
        background: var(--yellow);
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(var(--spin));
        animation: star-pop 820ms cubic-bezier(0.18, 0.84, 0.26, 1.18) var(--star-delay) both;
      }

      .headline,
      .copy,
      .note {
        opacity: 0;
        transform: translateY(14px) rotate(-1deg);
        animation: text-in 680ms ease-out forwards;
      }

      .headline {
        position: relative;
        margin: 4px 0 22px;
        color: var(--green-ink);
        font-size: clamp(2.35rem, 6.5vw, 4.75rem);
        line-height: 0.92;
        letter-spacing: -0.04em;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.16);
        animation-delay: 1.72s;
      }

      .headline::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -15px;
        width: min(86%, 420px);
        height: 17px;
        background: var(--yellow);
        clip-path: polygon(
          0 48%,
          10% 36%,
          21% 52%,
          33% 35%,
          47% 50%,
          59% 34%,
          72% 51%,
          84% 36%,
          100% 48%,
          100% 66%,
          86% 54%,
          72% 69%,
          59% 52%,
          47% 67%,
          33% 53%,
          22% 68%,
          10% 53%,
          0 66%
        );
        opacity: 0.74;
        transform: translateX(-50%);
      }

      .copy {
        max-width: 460px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.02rem, 2.4vw, 1.35rem);
        line-height: 1.6;
        animation-delay: 1.94s;
      }

      .copy strong {
        color: var(--yellow);
        font-weight: 400;
      }

      .note {
        margin-top: 14px;
        color: rgba(244, 241, 230, 0.62);
        font-size: clamp(0.95rem, 2vw, 1.14rem);
        animation-delay: 2.08s;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes logo-arrive {
        from {
          opacity: 0;
          transform: scale(0.76) rotate(-9deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes logo-fill {
        from {
          clip-path: inset(100% 0 0 0);
        }
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes ring-draw {
        from {
          opacity: 0;
          transform: scale(0.76) rotate(-20deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes star-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2) rotate(var(--spin));
        }
        28% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform:
            translate(calc(-50% + var(--sx)), calc(-50% + var(--sy)))
            scale(1)
            rotate(calc(var(--spin) + 120deg));
        }
      }

      @keyframes text-in {
        to {
          opacity: 1;
          transform: translateY(0) rotate(0deg);
        }
      }

      @keyframes artist-in {
        to {
          opacity: var(--opacity);
          transform: translate3d(-50%, -50%, 0) rotate(var(--tilt)) scale(1);
        }
      }

      @keyframes drift {
        from {
          translate: -4px 2px;
        }
        to {
          translate: 5px -5px;
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 24px;
        }

        .issue-link {
          display: none;
        }

        .artist {
          width: calc(var(--size) * 0.78);
          height: calc(var(--size) * 0.78);
        }

        .artist:nth-child(2),
        .artist:nth-child(7) {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="Spotify authentication complete">
      <a class="brand" href="https://github.com/dotpablos/vibel" aria-label="vibel home">vibel.</a>
      <a class="issue-link" href="https://github.com/dotpablos/vibel/issues">submit an issue</a>

      <div class="artist-field" aria-hidden="true">

        <img

          style="--x: 50%; --y: 91%; --size: 88px; --tilt: 5deg; --opacity: 0.22; --delay: 2.82s; --duration: 6.6s"
        />
      </div>

      <section class="card">
        <div class="logo-wrap" aria-hidden="true">
          <svg class="logo-emblem" viewBox="0 0 160 160" role="img" aria-label="Spotify logo loading">
            <circle class="ring" cx="80" cy="80" r="71"></circle>
            <circle class="ring" cx="80" cy="80" r="62"></circle>
            <circle class="ring" cx="80" cy="80" r="52"></circle>
            <g class="logo-shadow">
              <circle cx="80" cy="80" r="41" fill="#ffffff"></circle>
              <g transform="translate(39 39) scale(5.125)">
                <path
                  fill="var(--spotify-muted)"
                  d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"
                ></path>
                <path
                  class="spotify-green"
                  fill="var(--spotify)"
                  d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"
                ></path>
              </g>
            </g>
          </svg>
          <span class="star" style="--sx: -64px; --sy: -44px; --star-size: 13px; --spin: 8deg; --star-delay: 1.46s"></span>
          <span class="star" style="--sx: -38px; --sy: 58px; --star-size: 10px; --spin: 41deg; --star-delay: 1.5s"></span>
          <span class="star" style="--sx: 54px; --sy: -54px; --star-size: 12px; --spin: -24deg; --star-delay: 1.52s"></span>
          <span class="star" style="--sx: 72px; --sy: 24px; --star-size: 9px; --spin: 16deg; --star-delay: 1.57s"></span>
          <span class="star" style="--sx: 5px; --sy: -78px; --star-size: 11px; --spin: 64deg; --star-delay: 1.61s"></span>
        </div>

        <h1 class="headline">spotify authorization complete!</h1>
        <p class="copy">
          you're almost ready to start vibing <br/> head back to your
          <strong>terminal</strong> and make sure you have an active device ready
        </p>
        <span class="sr-only">Authentication complete.</span>
      </section>
    </main>
  </body>
</html>
